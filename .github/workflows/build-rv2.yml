name: Build OpenWrt RV2 with LuCI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            swig \
            time

      - name: Clone OpenWrt
        run: |
          git clone https://git.openwrt.org/openwrt/openwrt.git openwrt

      - name: Add RV2 target
        run: |
          cp -a target/linux/spacemit openwrt/target/linux/

      - name: Update feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Add LuCI
        working-directory: openwrt
        run: |
          ./scripts/feeds install luci
          echo 'CONFIG_PACKAGE_luci=y' >> .config
          echo 'CONFIG_PACKAGE_luci-theme-material=y' >> .config
          echo 'CONFIG_PACKAGE_luci-theme-openwrt-2020=y' >> .config

      - name: Configure
        working-directory: openwrt
        run: |
          make defconfig

      - name: Build
        working-directory: openwrt
        run: |
          make -j"$(nproc)"

      - name: Verify RV2 images
        working-directory: openwrt
        run: |
          test -f bin/targets/spacemit/generic/openwrt-spacemit-generic-xunlong_orangepi-rv2-squashfs-sdcard.img.gz
          test -f bin/targets/spacemit/generic/openwrt-spacemit-generic-xunlong_orangepi-rv2-ext4-sdcard.img.gz

          ls -lh bin/targets/spacemit/generic/

      - name: Upload RV2 images
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-rv2-luci
          path: |
            openwrt/bin/targets/spacemit/generic/openwrt-spacemit-generic-xunlong_orangepi-rv2-squashfs-sdcard.img.gz
            openwrt/bin/targets/spacemit/generic/openwrt-spacemit-generic-xunlong_orangepi-rv2-ext4-sdcard.img.gz
            openwrt/bin/targets/spacemit/generic/openwrt-spacemit-generic-xunlong_orangepi-rv2.manifest
            openwrt/bin/targets/spacemit/generic/*.sha256sums
          if-no-files-found: error
          retention-days: 14
          
